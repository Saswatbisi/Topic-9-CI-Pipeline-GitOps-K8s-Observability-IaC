apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orion-lms-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Saswatbisi/Topic-9-CI-Pipeline-GitOps-K8s-Observability-IaC.git'
    targetRevision: HEAD
    path: kubernetes/overlays/prod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: orion-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
