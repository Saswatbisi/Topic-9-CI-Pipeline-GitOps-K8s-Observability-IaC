apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-lms-deployment
  labels:
    app: orion-lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-lms
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        # HashiCorp Vault Agent Injector annotations
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "orion-app-role"
        vault.hashicorp.com/agent-inject-secret-database: "secret/data/database"
        vault.hashicorp.com/agent-inject-template-database: |
          {{- with secret "secret/data/database" -}}
          export DB_USER="{{ .Data.data.username }}"
          export DB_PASSWORD="{{ .Data.data.password }}"
          {{- end -}}
      labels:
        app: orion-lms
    spec:
      containers:
      - name: orion-app
        image: orion-lms-app:latest
        ports:
        - containerPort: 9090
        # Resource requests & limits
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Liveness & Readiness Probes
        livenessProbe:
          httpGet:
            path: /api/users/me
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/users/me
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 10
        # ConfigMap and Secret values injected as environment variables
        envFrom:
        - configMapRef:
            name: orion-lms-config
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: orion-lms-secrets
              key: jwt-secret
