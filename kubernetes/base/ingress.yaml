apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orion-lms-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: orion.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: orion-lms-service
            port:
              number: 80
